<!DOCTYPE html>
<html lang="id" data-type="software" data-radius="soft" data-buttons="true" data-motion="true">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tata Surya 3D Interaktif</title>
    <meta name="description" content="Interaktif 3D Tata Surya dengan 8 planet, cahaya realistis, dan kontrol kamera responsif">
    <meta name="page-type" content="software">
    <meta name="site-kind" content="tech">
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="app">
        <canvas id="solarCanvas"></canvas>
        
        <div id="hud" class="hidden">
            <div class="hud-header">
                <h1>Tata Surya 3D</h1>
                <div class="hud-controls">
                    <button id="toggleLabelBtn" aria-label="Tampilkan/lepas label">🔖</button>
                    <button id="toggleOrbitBtn" aria-label="Tampilkan/lepas orbit">🌍</button>
                    <button id="resetViewBtn" aria-label="Kembalikan ke tampilan awal">↺</button>
                </div>
            </div>
            
            <div class="hud-content">
                <div class="hud-planet-list">
                    <div class="planet-chip" data-planet="sun">🌞</div>
                    <div class="planet-chip" data-planet="mercury">☿</div>
                    <div class="planet-chip" data-planet="venus">♀</div>
                    <div class="planet-chip" data-planet="earth">🌍</div>
                    <div class="planet-chip" data-planet="mars">♂</div>
                    <div class="planet-chip" data-planet="jupiter">♃</div>
                    <div class="planet-chip" data-planet="saturn">♄</div>
                    <div class="planet-chip" data-planet="uranus">♅</div>
                    <div class="planet-chip" data-planet="neptune">♆</div>
                </div>
            </div>
        </div>
        
        <div id="infoPanel" class="hidden">
            <div class="info-content">
                <button id="closeBtn" aria-label="Tutup panel informasi">&times;</button>
                <h2 id="planetName"></h2>
                <p class="tagline" id="planetTagline"></p>
                <p class="desc" id="planetDesc"></p>
                <div class="data-grid">
                    <div class="data-item"><strong>Diameter:</strong> <span id="dataDiameter">-</span></div>
                    <div class="data-item"><strong>Jarak:</strong> <span id="dataDistance">-</span></div>
                    <div class="data-item"><strong>Orbit:</strong> <span id="dataOrbit">-</span></div>
                </div>
                <p class="fact"><strong>Fakta:</strong> <span id="planetFact">-</span></p>
            </div>
        </div>
        
        <div id="ui-container">
            <div id="controls">
                <button id="playPauseBtn" aria-label="Putar/pause">⏸</button>
                <input type="range" id="speedSlider" min="0" max="10" step="0.1" value="1">
                <span id="speedDisplay">1.0x</span>
                <button id="resetCamBtn" aria-label="Reset Kamera" title="Reset Kamera">↺</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
